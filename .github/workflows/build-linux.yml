name: Build Linux

# Manual Linux-only build (deb + AppImage) without signing or publishing.
# Artifacts stay private to the workflow run. Intended for forks and local
# machines that cannot compile the Tauri app comfortably.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (linux-x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Build Tauri bundles
        run: >
          bun run tauri build
          --target x86_64-unknown-linux-gnu
          --bundles deb,appimage
          --config src-tauri/tauri.conf.prod.json
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload bundles
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: termul-linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
